stages:
  - build-web-server
  - build
  - release

default:
  image:
    name: $CI_REGISTRY_IMAGE/static-builder:latest
    pull_policy: always
    entrypoint: [""]

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d{2}\.\d{2}(\.\d+)?$/

variables:

build-web-server:
  tags:
    - saas-linux-small-amd64
  stage: build-web-server
  image: docker:27
  services:
    - docker:27-dind
  interruptible: true
  variables:
    WEB_TAG: "$CI_COMMIT_TAG-$CI_COMMIT_SHORT_SHA"
    WEB_IMAGE: "$CI_REGISTRY_IMAGE/web-server"
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    GIT_DEPTH: 0
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker system prune -a
    - docker buildx prune -a
  script:
    - df -h
    - df -i
    - env | grep CI_REGISTRY
    - |
      docker build --tag "$WEB_IMAGE:$WEB_TAG" --file pkg/docker/web-server/Dockerfile \
        pkg/docker/web-server
    - docker tag "$WEB_IMAGE:$WEB_TAG" "$WEB_IMAGE:latest"
    - docker push "$WEB_IMAGE:$WEB_TAG"
    - docker push "$WEB_IMAGE:latest"

build-static:
  stage: build
  needs: []
  interruptible: true
  image:
    name: $CI_REGISTRY_IMAGE/static-builder:latest
    pull_policy: always
    entrypoint: [""]
  variables:
    GIT_DEPTH: 1
    GIT_SUBMODULE_STRATEGY: recursive
  before_script:
    - |
      SCRIPT_VER=$(sed -n 's/^VER=//p' pkg/makeself/generate_installer)
      if [ "$SCRIPT_VER" != "$CI_COMMIT_TAG" ]; then
        echo "ERROR: Git tag '$CI_COMMIT_TAG' does not match" \
             "VER='$SCRIPT_VER' in pkg/makeself/generate_installer." \
             "Bump the version before tagging."
        exit 1
      fi
  script:
    - cmake -S . -B build -G"Ninja Multi-Config" -DCMAKE_BUILD_TYPE=Release --fresh
    - cmake --build build --config Release --parallel
    - cd pkg/makeself && ./generate_installer
  artifacts:
    name: "Munadi-${CI_COMMIT_TAG}"
    paths:
      - pkg/makeself/Munadi-*.run
    expire_in: 1 year

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build-static
  script:
    - echo "Generating SHA256 checksum for the package..."
    - sha256sum pkg/makeself/Munadi-$CI_COMMIT_TAG.run > pkg/makeself/Munadi-$CI_COMMIT_TAG.run.sha256
    - |
      {
        echo "See [CHANGELOG]($CI_PROJECT_URL/-/blob/$CI_COMMIT_TAG/CHANGELOG.md) for what's new."
        echo ""
        echo "### Checksum"
        echo "\`\`\`"
        cat pkg/makeself/Munadi-$CI_COMMIT_TAG.run.sha256
        echo "\`\`\`"
      } > release-description.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Munadi $CI_COMMIT_TAG"
    description: release-description.md
    assets:
      links:
        - name: "Munadi-$CI_COMMIT_TAG.run"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/pkg/makeself/Munadi-$CI_COMMIT_TAG.run?job=build-static"
          link_type: package
        - name: "Munadi-$CI_COMMIT_TAG.run.sha256"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/pkg/makeself/Munadi-$CI_COMMIT_TAG.run.sha256?job=create-release"
          link_type: other

stages:
  - build-image
  - build
  - release

variables:
  BUILDER_IMAGE: "$CI_REGISTRY_IMAGE/builder:rocky10"
  GIT_DEPTH: 0

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d{2}\.\d{2}(\.\d+)?$/

build-image:
  stage: build-image
  rules:
    - when: never
  tags:
    - saas-linux-medium-amd64
  image: docker:27
  services:
    - docker:27-dind
  interruptible: true
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --use --driver docker-container --name ci-builder
    - docker system prune -a
    - docker buildx prune -a
  script:
    - df -h
    - df -i
    - env | grep CI_REGISTRY
    - |
      docker build \
        --cache-from "type=registry,ref=$BUILDER_CACHE" \
        --cache-to   "type=registry,ref=$BUILDER_CACHE,mode=max" \
        --tag "$BUILDER_IMAGE" \
        --file pkg/docker/Dockerfile \
        pkg/docker/
    - docker push "$BUILDER_IMAGE"

build-static:
  stage: build
  image:
    name: $BUILDER_IMAGE
    pull_policy: always
  needs: []
  interruptible: true
  before_script:
    - |
      SCRIPT_VER=$(grep '^VER=' pkg/makeself/generate_installer | cut -d= -f2)
      if [ "$SCRIPT_VER" != "$CI_COMMIT_TAG" ]; then
        echo "ERROR: Git tag '$CI_COMMIT_TAG' does not match" \
             "VER='$SCRIPT_VER' in pkg/makeself/generate_installer." \
             "Bump the version before tagging."
        exit 1
      fi
  script:
    - cmake -S . -B build -G "Ninja Multi-Config" -DCMAKE_BUILD_TYPE=Release
    - cmake --build build --config Release --parallel
    - cd pkg/makeself && ./generate_installer
  artifacts:
    name: "Munadi-${CI_COMMIT_TAG}-x86_64"
    paths:
      - pkg/makeself/Munadi-*.run
    expire_in: never

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build-static
  script:
    - echo "Creating GitLab release for Munadi $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Munadi $CI_COMMIT_TAG"
    description: |
      Static x86_64 self-extracting installer for Munadi $CI_COMMIT_TAG.
      No external dependencies required — just download, mark executable, and run.

      **Quick install**
      ```sh
      curl -JLO $CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG/downloads/Munadi-$CI_COMMIT_TAG.run
      sh Munadi-$CI_COMMIT_TAG.run
      ```

      See [CHANGELOG]($CI_PROJECT_URL/-/blob/$CI_COMMIT_TAG/CHANGELOG.md) for what's new.
    assets:
      links:
        - name: "Munadi-$CI_COMMIT_TAG.run"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/pkg/makeself/Munadi-$CI_COMMIT_TAG.run?job=build-static"
          link_type: package

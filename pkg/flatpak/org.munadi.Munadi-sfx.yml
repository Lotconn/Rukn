app-id: org.munadi.Munadi
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: munadi

finish-args:
  - --device=dri
  - --filesystem=xdg-run/pipewire-0
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=QT_QPA_PLATFORMTHEME=gnome

modules:
  - name: munadi
    buildsystem: simple
    build-commands:
      - sh ./Munadi.run -nx ./
      - install -Dm0755 ./munadi --t ${FLATPAK_DEST}/bin/
      - install -t ${FLATPAK_DEST}/share/applications/ -Dm0644 ./xdg/applications/org.munadi.Munadi.desktop
      - cp -rt ${FLATPAK_DEST}/share/ ./xdg/icons/
      - install -t ${FLATPAK_DEST}/share/metainfo/ -Dm0644 ./xdg/metainfo/org.munadi.Munadi.metainfo.xml
    sources:
      - type: file
        url: "https://gitlab.com/munadi/munadi/-/jobs/artifacts/26.04/raw/pkg/makeself/Munadi-26.04.run?job=build-static"
        sha256: e0ffbafb3267da85e781fa467caa67fa9a4ae5eb3eeb90a16e5a2d308c079019
        dest-filename: Munadi.run
        only-arches:
          - x86_64

      - type: git
        url: https://gitlab.com/munadi/munadi.git
        tag: "26.04"
        commit: d54236a1ae3476a5f448dfe35a182cdf952f65ce
        disable-modules: true
      - type: file
        path: xdg/applications/org.munadi.Munadi.desktop
      - type: file
        path: xdg/metainfo/org.munadi.Munadi.metainfo.xml
      - type: dir
        path: xdg/icons/

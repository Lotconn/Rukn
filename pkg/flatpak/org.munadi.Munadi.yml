app-id: org.munadi.Munadi
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: munadi
finish-args:
  - --device=dri
  - --filesystem=xdg-run/pipewire-0
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
cleanup:
  - /include
  - /lib/cmake
  - /lib/HasanEsa
  - /lib/qml
  - '*.la'
  - '*.a'
modules:
  - name: munadi
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DFETCHCONTENT_SOURCE_DIR_FILEMAN=/run/build/munadi/subprojects/fileman
      - -DFETCHCONTENT_SOURCE_DIR_SINGLEAPPLICATION=/run/build/munadi/subprojects/singleapplication
    sources:
      - type: dir
        path: ./
      - type: git
        url: https://gitlab.com/HasanEsa/FileMan
        commit: 663d579579a81dcbeeff8dccd34f74734912243b
        dest: subprojects/fileman
      - type: git
        url: https://github.com/itay-grudev/SingleApplication
        commit: a218603d76a55dddb65b84f2b49ecaa8efc074ea
        dest: subprojects/singleapplication
